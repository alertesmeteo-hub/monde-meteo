name: Données monde (satellite, GFS, cyclones)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Régénérer le GFS monde même si le run est déjà publié"
        type: boolean
        default: false
  schedule:
    # Best-effort côté GitHub : la route /api/cron/lancer-modeles du site relance aussi ce workflow.
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: update-monde
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Reprendre les données déjà publiées
        run: |
          mkdir -p pub
          if git fetch --depth 1 origin data 2>/dev/null; then
            git --work-tree=pub checkout FETCH_HEAD -- .
            git reset -q
          fi
          ls pub || true

      - name: Mettre à jour satellite, cyclones, côtes, GFS monde, tendance et randonnée
        run: python scripts/update_monde.py --out pub ${{ inputs.force && '--force' || '' }}

      - name: Publier sur la branche data
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          cd pub
          rm -rf .git maps.tmp
          touch .nojekyll
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -q -m "Données monde $(date -u +'%Y-%m-%d %H:%M UTC')"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git"
          git push -q --force origin data
